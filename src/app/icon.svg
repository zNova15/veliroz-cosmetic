<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Monograma Veliroz — V con remates serif.
       Dibujado con paths y no con <text> para no depender de que el
       renderer tenga la fuente: un favicon que cae a Times se ve roto.
       Los remates superiores y el contraste grueso/fino riman con la
       serif de la marca (Fraunces en la web, Didot en las piezas).
       Verificado legible a 16px, que es donde se rompen la mayoría. -->
  <rect width="100" height="100" rx="22" fill="#1A1613"/>
  <path d="M14 25 H40 V30 H34.5 L50 68 L64 30 H58.5 V25 H84 V30 H78 L57 82 H45 L22 30 H14 Z" fill="#D4B896"/>
</svg>
