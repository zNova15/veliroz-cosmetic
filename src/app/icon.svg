  <!-- Veliroz Cosmetic — la V de Bodoni 72 Italic.
       Los intentos previos (monograma dibujado, capullo de pétalos) fallaban
       por lo mismo: eran formas inventadas. Los logos del rubro que funcionan
       —Aesop, Byredo, Glossier, The Ordinary— son TIPOGRÁFICOS.
       Esta es la letra real de la fuente, convertida a path con fontTools
       para no depender de que el renderer tenga Bodoni instalada.
       El contraste grueso/fino y la inclinación la hacen leer como una firma,
       y a 16px el trazo grueso sostiene la forma. -->
