<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Veliroz Cosmetic — capullo de tres pétalos.
       Reemplaza al monograma "V", que no decía nada del rubro.
       Dos lecturas a propósito: es una flor (belleza, y el hilo con
       Veliroz Flores Eternas) y su silueta general dibuja una V.
       El pétalo central va al 45% de opacidad para dar profundidad sin
       sumar una forma nueva — a 16px se funde y quedan los dos de
       adelante, que es exactamente lo que tiene que leerse en chico. -->
  <rect width="100" height="100" rx="22" fill="#1A1613"/>
  <path d="M50 80 C42 62 42 40 50 22 C58 40 58 62 50 80 Z" fill="#D4B896" opacity=".45"/>
  <path d="M48 83 C26 64 20 42 29 25 C41 32 47 44 48 60 Z" fill="#D4B896"/>
  <path d="M52 83 C74 64 80 42 71 25 C59 32 53 44 52 60 Z" fill="#D4B896"/>
</svg>
